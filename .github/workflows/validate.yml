name: Validate Quarto site
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.31
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Validate source metadata, YAML, links, and templates
        run: python scripts/validate_site.py
      - name: Render site
        run: quarto render
      - name: Validate rendered site
        run: python scripts/validate_site.py --rendered
