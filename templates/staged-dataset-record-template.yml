# Staged-dataset record. Replace placeholders; do not include credentials or protected contents.
# Required fields are marked REQUIRED. Other fields are optional when not applicable.
# This template is intended primarily for staged datasets. It may be adapted for a derived
# dataset by explicitly changing dataset_role; derived datasets must still identify their
# input dataset IDs and transformation IDs, and the readiness requirements do not change.
dataset_id: "REQUIRED-replace-me"
dataset_version: null
dataset_role: "staged"
purpose: "REQUIRED-describe the controlled staged representation"
# Allowed readiness values:
# - not ready for analysis
# - ready for analysis
# - ready for analysis with documented limitation
# Status may change from not ready for analysis only after the Organize gate has been reviewed.
status: "not ready for analysis"
authoritative_location: "REQUIRED-approved location or project reference"
source_ids: ["REQUIRED-source-id"]
snapshot_ids: ["REQUIRED-snapshot-id"]
intake_ids: []
transformation_ids: ["REQUIRED-transformation-id-or-script-log-reference"]
format: null
schema_version: null
data_dictionary: "REQUIRED-path-or-reference-to-data-dictionary"
primary_key: null
foreign_keys: []
# Actual record count is required when meaningful; use null when not applicable or not yet recorded.
record_count: null
spatial:
  crs: "not_applicable"
  datum: "not_applicable"
  units: "not_applicable"
  extent: "not_applicable"
  resolution_or_support: "not_applicable"
  alignment_or_origin: "not_applicable"
  boundary_version: "not_applicable"
  sensitivity: null
temporal:
  start: "not_applicable"
  end: "not_applicable"
  support: "not_applicable"
  timezone: "not_applicable"
  week_convention: "not_applicable"
restrictions: "REQUIRED-public, restricted, or applicable agreement reference"
code_version: "REQUIRED-Git commit or documented exception"
configuration_version: "configuration version or not_applicable"
qa_record: "REQUIRED-path-or-reference-to-structural-QA"
limitations: []
supersedes: ""
responsible_role: "REQUIRED-role or account"
# Responsible for maintaining the dataset; this is distinct from the readiness decision-maker.
readiness_decision_by: null
readiness_decision_at: null
# Both readiness fields remain blank while status is not ready for analysis and are required
# when status changes to either ready state. readiness_decision_at uses an ISO 8601 timestamp.
created_at: null
